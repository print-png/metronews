<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetroNews</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        :root {
            --win-blue: #2d89ef;
            --win-purple: #603cba;
            --win-orange: #da532c;
            --win-green: #00a300;
            --win-red: #b91d47;
            --win-teal: #00aba9;
            --win-pink: #ff0097;
            --win-bg: #603cba; /* Стандартный фон — фиолетовый */
            --tile-size: 260px;
            --gap: 10px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI Semilight", "Segoe UI", Tahoma, sans-serif;
            background-color: var(--win-bg);
            color: white;
            overflow: hidden;
            height: 100vh;
            transition: background-color 0.5s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        header { padding: 80px 60px 20px 60px; background: transparent; }
        h1 { font-weight: 300; font-size: 56px; margin: 0; letter-spacing: -1px; text-transform: lowercase; text-shadow: 0 2px 8px rgba(0,0,0,0.2); }

        .container {
            padding: 20px 60px 60px 60px;
            overflow-x: auto;
            overflow-y: hidden;
            height: calc(100vh - 180px);
            display: flex;
            align-items: flex-start;
        }

        .grid {
            display: grid;
            grid-auto-flow: column;
            grid-template-rows: repeat(2, var(--tile-size));
            grid-auto-columns: min-content;
            gap: var(--gap);
            height: calc(2 * var(--tile-size) + var(--gap));
        }

        .tile { perspective: 1000px; cursor: pointer; width: var(--tile-size); height: var(--tile-size); }
        .tile.wide { width: calc(2 * var(--tile-size) + var(--gap)); grid-column: span 2; }

        .tile-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .tile.flip .tile-inner { transform: rotateY(180deg); }

        .tile-front, .tile-back {
            position: absolute;
            width: 100%;
            height: 100%;
            padding: 20px;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .tile-front h3 { font-size: 19px; font-weight: 300; margin: 0; line-height: 1.3; }
        .tile-back { transform: rotateY(180deg); background: #2b2b2b; border: 1px solid #444; }
        .tile-back p { font-size: 13px; line-height: 1.4; margin: 10px 0; flex-grow: 1; overflow: hidden; }

        /* ЧАСЫ: Теперь фиолетовые */
        .clock-tile { 
            background: var(--win-purple); 
            justify-content: center; 
            align-items: flex-start; 
            padding-left: 35px !important;
            border: 1px solid rgba(255,255,255,0.1); /* Легкая рамка, чтобы не сливаться с фоном */
        }
        #clock-time { font-size: 86px; font-weight: 100; margin: 0; line-height: 0.9; }
        #clock-date { font-size: 20px; margin: 10px 0 0 5px; text-transform: lowercase; opacity: 0.9; }

        .finance-tile {
            background: var(--win-orange);
            display: flex;
            flex-direction: row !important;
            justify-content: space-around;
            align-items: center;
        }
        .currency-item { text-align: left; }
        .currency-label { font-size: 18px; text-transform: lowercase; opacity: 0.8; }
        .currency-value { font-size: 48px; font-weight: 100; margin: 5px 0; }
        .currency-up { color: #afff00; font-size: 14px; }
        
        .settings-tile { background: #4b4b4b; display: flex; align-items: center; justify-content: center; }
        .settings-tile .icon { font-size: 70px; margin-bottom: 10px; }
        .settings-tile .label { position: absolute; bottom: 15px; left: 20px; font-size: 14px; text-transform: lowercase; }

        .win8-button {
            display: inline-block;
            background: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 6px 12px;
            font-family: "Segoe UI", sans-serif;
            font-size: 13px;
            text-align: center;
            text-transform: lowercase;
            cursor: pointer;
            transition: all 0.1s ease;
            text-decoration: none;
            width: fit-content;
        }
        .win8-button:hover { background-color: #ffffff; color: #1d1d1d; }

        .c1{background:var(--win-blue);} .c2{background:var(--win-teal);} .c3{background:var(--win-pink);}
        .c4{background:var(--win-orange);} .c5{background:var(--win-green);} .c6{background:var(--win-red);}

        .settings-panel {
            position: fixed; right: -360px; top: 0; width: 350px; height: 100vh;
            background: #1d1d1d; z-index: 2000; padding: 60px 30px;
            transition: right 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }
        .settings-panel.active { right: 0; }
        .settings-panel h2 { font-weight: 300; font-size: 32px; margin-bottom: 20px; text-transform: lowercase; }
        
        .color-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 20px; }
        .color-opt { width: 100%; height: 65px; cursor: pointer; border: 2px solid transparent; transition: border 0.2s; }
        .color-opt:hover { border-color: rgba(255,255,255,0.8); }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); display: none; z-index: 1999; }

        .modal { position: fixed; inset: 0; background: #1d1d1d; display: none; z-index: 1000; padding: 80px 60px; overflow-y: auto; }
        .modal-content { max-width: 900px; margin: 0 auto; }
        .close-back-btn { position: fixed; top: 40px; left: 40px; width: 44px; height: 44px; border: 2px solid white; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .close-back-btn::after { content: ''; width: 10px; height: 10px; border-left: 2px solid white; border-bottom: 2px solid white; transform: rotate(45deg); margin-left: 4px; }

        .container::-webkit-scrollbar { height: 10px; }
        .container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body>

<header><h1>новости</h1></header>

<div class="container" id="scrollContainer">
    <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="overlay" onclick="toggleSettings()"></div>
<div class="settings-panel" id="settingsPanel">
    <h2>параметры</h2>
    <p style="opacity: 0.7; font-size: 14px;">персонализация фона:</p>
    <div class="color-grid">
        <div class="color-opt" style="background: #603cba;" onclick="changeBg('#603cba')"></div>
        <div class="color-opt" style="background: #004d60;" onclick="changeBg('#004d60')"></div>
        <div class="color-opt" style="background: #1d1d1d;" onclick="changeBg('#1d1d1d')"></div>
        <div class="color-opt" style="background: #4b0082;" onclick="changeBg('#4b0082')"></div>
        <div class="color-opt" style="background: #008a00;" onclick="changeBg('#008a00')"></div>
        <div class="color-opt" style="background: #b91d47;" onclick="changeBg('#b91d47')"></div>
        <div class="color-opt" style="background: #2d89ef;" onclick="changeBg('#2d89ef')"></div>
        <div class="color-opt" style="background: #da532c;" onclick="changeBg('#da532c')"></div>
        <div class="color-opt" style="background: #00aba9;" onclick="changeBg('#00aba9')"></div>
        <div class="color-opt" style="background: #ff0097;" onclick="changeBg('#ff0097')"></div>
        <div class="color-opt" style="background: #99b433;" onclick="changeBg('#99b433')"></div>
        <div class="color-opt" style="background: #e3a21a;" onclick="changeBg('#e3a21a')"></div>
    </div>
    <br><br>
    <button class="win8-button" onclick="toggleSettings()">закрыть</button>
</div>

<div class="modal" id="modal">
    <div class="close-back-btn" onclick="closeModal()"></div>
    <div class="modal-content" id="modalContent"></div>
</div>

<script>
    const API_NEWS = "https://api.rss2json.com/v1/api.json?rss_url=https://naked-science.ru/feed";
    const API_CURRENCY = "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json";
    const API_EUR = "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/eur.json";
    
    const grid = document.getElementById("grid");
    const colors = ["c1","c2","c3","c4","c5","c6"];

    async function init() {
        const savedColor = localStorage.getItem('metro-bg');
        if(savedColor) changeBg(savedColor);

        createClockTile();
        createSettingsTile();
        await createFinanceTile();
        loadNews();
    }

    function updateClock() {
        const now = new Date();
        const clockEl = document.getElementById('clock-time');
        const dateEl = document.getElementById('clock-date');
        if (clockEl) clockEl.textContent = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        if (dateEl) dateEl.textContent = now.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
    }

    function createClockTile() {
        const tile = document.createElement("div");
        tile.className = "tile wide";
        tile.innerHTML = `<div class="tile-inner"><div class="tile-front clock-tile"><p id="clock-time">00:00</p><p id="clock-date">...</p></div></div>`;
        grid.appendChild(tile);
        setInterval(updateClock, 1000);
        updateClock();
    }

    function createSettingsTile() {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.innerHTML = `
            <div class="tile-inner" onclick="toggleSettings()">
                <div class="tile-front settings-tile">
                    <div class="icon">⚙</div>
                    <div class="label">параметры</div>
                </div>
            </div>`;
        grid.appendChild(tile);
    }

    async function createFinanceTile() {
        const tile = document.createElement("div");
        tile.className = "tile wide";
        tile.innerHTML = `
            <div class="tile-inner">
                <div class="tile-front finance-tile">
                    <div class="currency-item">
                        <div class="currency-label">1 Доллар</div>
                        <div class="currency-value" id="usd-val">--</div>
                        <div class="currency-up">▲ 0.4%</div>
                    </div>
                    <div class="currency-item">
                        <div class="currency-label">1 Евро</div>
                        <div class="currency-value" id="eur-val">--</div>
                        <div class="currency-up">▲ 0.2%</div>
                    </div>
                </div>
            </div>`;
        grid.appendChild(tile);

        try {
            const [resUsd, resEur] = await Promise.all([fetch(API_CURRENCY), fetch(API_EUR)]);
            const dataUsd = await resUsd.json();
            const dataEur = await resEur.json();
            document.getElementById('usd-val').textContent = dataUsd.usd.rub.toFixed(2);
            document.getElementById('eur-val').textContent = dataEur.eur.rub.toFixed(2);
        } catch (e) { console.error("Ошибка валют:", e); }
    }

    async function loadNews() {
        try {
            const res = await fetch(API_NEWS);
            const data = await res.json();
            data.items.slice(0, 14).forEach((item, i) => createTile(item, i));
        } catch (e) { console.error(e); }
    }

    function createTile(article, i) {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.innerHTML = `
            <div class="tile-inner">
                <div class="tile-front ${colors[i % colors.length]}">
                    <h3>${article.title}</h3>
                    <div style="margin-top:auto;"><div class="win8-button">далее</div></div>
                </div>
                <div class="tile-back">
                    <p>${article.description.replace(/<[^>]*>?/gm, '').substring(0, 150)}...</p>
                    <div class="win8-button" onclick="event.stopPropagation(); openArticle('${i}')">открыть</div>
                </div>
            </div>`;
        window[`article_${i}`] = article;
        tile.onclick = () => tile.classList.toggle("flip");
        grid.appendChild(tile);
    }

    function toggleSettings() {
        const panel = document.getElementById('settingsPanel');
        panel.classList.toggle('active');
        document.getElementById('overlay').style.display = panel.classList.contains('active') ? 'block' : 'none';
    }

    function changeBg(color) {
        document.documentElement.style.setProperty('--win-bg', color);
        localStorage.setItem('metro-bg', color);
    }

    function openArticle(id) {
        const article = window[`article_${id}`];
        document.getElementById("modal").style.display = "block";
        document.getElementById("modalContent").innerHTML = `
            <h2 style="font-size: 42px; font-weight: 300;">${article.title}</h2>
            <div style="font-size: 18px; line-height: 1.6; color: #ccc;">${article.content}</div>
            <br><br>
            <a href="${article.link}" target="_blank" class="win8-button">источник</a>`;
    }

    function closeModal() { document.getElementById("modal").style.display = "none"; }

    const scrollContainer = document.getElementById('scrollContainer');
    scrollContainer.addEventListener('wheel', (evt) => {
        evt.preventDefault();
        scrollContainer.scrollLeft += evt.deltaY;
    });

    init();
</script>
</body>
</html>
