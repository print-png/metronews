<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetroNews</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        :root {
            --win-blue: #2d89ef;
            --win-purple: #603cba;
            --win-orange: #da532c;
            --win-green: #00a300;
            --win-red: #b91d47;
            --win-teal: #00aba9;
            --win-pink: #ff0097;
            --tile-size: 260px;
            --gap: 10px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI Semilight", "Segoe UI", Tahoma, sans-serif;
            background: url('background.png') no-repeat center center fixed;
            background-size: cover;
            color: white;
            background-color: #004d60; 
            overflow: hidden; /* Скрываем общий скролл страницы */
            height: 100vh;
        }

        header {
            padding: 80px 60px 20px 60px;
            background: transparent; 
        }

        h1 { 
            font-weight: 300; 
            font-size: 56px; 
            margin: 0;
            letter-spacing: -1px;
            text-transform: lowercase;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        /* КОНТЕЙНЕР С ГОРИЗОНТАЛЬНЫМ СКРОЛЛОМ */
        .container {
            padding: 20px 60px 60px 60px;
            overflow-x: auto; /* Включаем скролл вправо */
            overflow-y: hidden;
            height: calc(100vh - 180px);
            display: flex;
            align-items: flex-start;
        }

        /* СЕТКА, РАСТУЩАЯ В КОЛОНКИ */
        .grid {
            display: grid;
            grid-auto-flow: column; /* Плитки идут вправо */
            grid-template-rows: repeat(2, var(--tile-size)); /* 2 ряда плиток */
            grid-auto-columns: min-content;
            gap: var(--gap);
            height: calc(2 * var(--tile-size) + var(--gap));
        }

        /* БАЗОВЫЙ РАЗМЕР ПЛИТКИ */
        .tile { 
            perspective: 1000px; 
            cursor: pointer; 
            width: var(--tile-size);
            height: var(--tile-size);
        }

        .tile.wide {
            width: calc(2 * var(--tile-size) + var(--gap));
            grid-column: span 2;
        }

        /* ЧАСЫ */
        .clock-tile {
            background: var(--win-purple);
            justify-content: center;
            align-items: flex-start;
            padding-left: 35px !important;
        }

        #clock-time { font-size: 86px; font-weight: 100; margin: 0; line-height: 0.9; }
        #clock-date { font-size: 20px; margin: 10px 0 0 5px; text-transform: lowercase; opacity: 0.9; }

        /* ФИНАНСЫ (КУРСЫ) */
        .finance-tile {
            background: var(--win-orange);
            display: flex;
            flex-direction: row !important;
            justify-content: space-around;
            align-items: center;
        }

        .currency-item { text-align: left; }
        .currency-label { font-size: 18px; text-transform: lowercase; opacity: 0.8; }
        .currency-value { font-size: 48px; font-weight: 100; margin: 5px 0; }
        .currency-up { color: #afff00; font-size: 14px; }

        .win8-button {
            display: inline-block;
            background: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 6px 12px;
            font-family: "Segoe UI", sans-serif;
            font-size: 13px;
            text-align: center;
            text-transform: lowercase;
            cursor: pointer;
            transition: all 0.1s ease;
            user-select: none;
            text-decoration: none;
            width: fit-content;
        }

        .win8-button:hover { background-color: #ffffff; color: #1d1d1d; }
        .win8-button:active { transform: scale(0.95); }

        .tile-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .tile.flip .tile-inner { transform: rotateY(180deg); }

        .tile-front, .tile-back {
            position: absolute;
            width: 100%;
            height: 100%;
            padding: 20px;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .tile-front h3 { font-size: 19px; font-weight: 300; margin: 0; line-height: 1.3; }
        .tile-back { transform: rotateY(180deg); background: #2b2b2b; border: 1px solid #444; }
        .tile-back p { font-size: 13px; line-height: 1.4; margin: 10px 0; flex-grow: 1; overflow: hidden; }

        .c1{background:var(--win-blue);}
        .c2{background:var(--win-teal);}
        .c3{background:var(--win-purple);}
        .c4{background:var(--win-orange);}
        .c5{background:var(--win-green);}
        .c6{background:var(--win-red);}
        .c7{background:var(--win-pink);}

        /* СТИЛЬ СКРОЛЛБАРА */
        .container::-webkit-scrollbar { height: 10px; }
        .container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .container::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        /* МОДАЛКА */
        .modal {
            position: fixed;
            inset: 0;
            background: #1d1d1d;
            display: none;
            z-index: 1000;
            padding: 80px 60px;
            overflow-y: auto;
        }

        .modal-content { max-width: 900px; margin: 0 auto; }
        .modal-content h2 { font-size: 42px; font-weight: 300; margin-bottom: 30px; }

        .close-back-btn {
            position: fixed;
            top: 40px;
            left: 40px;
            width: 44px;
            height: 44px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
        }

        .close-back-btn::after {
            content: '';
            width: 12px; height: 12px;
            border-left: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            transform: rotate(45deg);
            margin-left: 4px;
        }
    </style>
</head>
<body>

<header>
    <h1>новости</h1>
</header>

<div class="container" id="scrollContainer">
    <div class="grid" id="grid"></div>
</div>

<div class="modal" id="modal">
    <div class="close-back-btn" onclick="closeModal()"></div>
    <div class="modal-content" id="modalContent"></div>
</div>

<script>
    const API_NEWS = "https://api.rss2json.com/v1/api.json?rss_url=https://naked-science.ru/feed";
    const API_CURRENCY = "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json";
    const API_EUR = "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/eur.json";
    
    const grid = document.getElementById("grid");
    const modal = document.getElementById("modal");
    const modalContent = document.getElementById("modalContent");
    const colors = ["c1","c2","c3","c4","c5","c6","c7"];

    function updateClock() {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        const dateStr = now.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
        if(document.getElementById('clock-time')) {
            document.getElementById('clock-time').textContent = timeStr;
            document.getElementById('clock-date').textContent = dateStr;
        }
    }

    function createClockTile() {
        const tile = document.createElement("div");
        tile.className = "tile wide";
        tile.innerHTML = `<div class="tile-inner"><div class="tile-front clock-tile"><p id="clock-time">00:00</p><p id="clock-date">...</p></div></div>`;
        grid.appendChild(tile);
        setInterval(updateClock, 1000);
        updateClock();
    }

    async function createFinanceTile() {
        const tile = document.createElement("div");
        tile.className = "tile wide";
        tile.innerHTML = `
            <div class="tile-inner">
                <div class="tile-front finance-tile">
                    <div class="currency-item">
                        <div class="currency-label">1 Доллар</div>
                        <div class="currency-value" id="usd-val">--</div>
                        <div class="currency-up">▲ 0.4%</div>
                    </div>
                    <div class="currency-item">
                        <div class="currency-label">1 Евро</div>
                        <div class="currency-value" id="eur-val">--</div>
                        <div class="currency-up">▲ 0.2%</div>
                    </div>
                </div>
            </div>`;
        grid.appendChild(tile);

        try {
            const resUsd = await fetch(API_CURRENCY);
            const dataUsd = await resUsd.json();
            const resEur = await fetch(API_EUR);
            const dataEur = await resEur.json();
            
            document.getElementById('usd-val').textContent = dataUsd.usd.rub.toFixed(2);
            document.getElementById('eur-val').textContent = dataEur.eur.rub.toFixed(2);
        } catch (e) { console.error("Ошибка валют:", e); }
    }

    async function loadNews() {
        createClockTile();
        await createFinanceTile();
        try {
            const res = await fetch(API_NEWS);
            const data = await res.json();
            data.items.slice(0, 16).forEach((item, i) => createTile(item, i));
        } catch (e) { console.error(e); }
    }

    function createTile(article, i) {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.innerHTML = `
            <div class="tile-inner">
                <div class="tile-front ${colors[i % colors.length]}">
                    <h3>${article.title}</h3>
                    <div style="margin-top:auto;"><div class="win8-button">читать далее</div></div>
                </div>
                <div class="tile-back">
                    <p>${article.description.replace(/<[^>]*>?/gm, '').substring(0, 160)}...</p>
                    <div class="win8-button" onclick="event.stopPropagation(); openArticle('${i}')">открыть</div>
                </div>
            </div>`;
        window[`article_${i}`] = article;
        tile.onclick = () => tile.classList.toggle("flip");
        grid.appendChild(tile);
    }

    function openArticle(id) {
        const article = window[`article_${id}`];
        modal.style.display = "block";
        document.body.style.overflow = "hidden";
        modalContent.innerHTML = `<h2>${article.title}</h2><div style="font-size: 18px; line-height: 1.6; color: #ccc;">${article.content}</div><br><br><a href="${article.link}" target="_blank" class="win8-button">источник</a>`;
    }

    function closeModal() { modal.style.display = "none"; document.body.style.overflow = "auto"; }

    // Горизонтальный скролл колесиком мыши
    const scrollContainer = document.getElementById('scrollContainer');
    scrollContainer.addEventListener('wheel', (evt) => {
        evt.preventDefault();
        scrollContainer.scrollLeft += evt.deltaY;
    });

    loadNews();

    setInterval(async () => {
        try {
            const resUsd = await fetch(API_CURRENCY + '?nocache=' + Math.random());
            const dataUsd = await resUsd.json();
            document.getElementById('usd-val').textContent = dataUsd.usd.rub.toFixed(2);
        } catch (e) { console.error("Обновление не удалось"); }
    }, 600000);
</script>
</body>
</html>
