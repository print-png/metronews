<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 8.1 News Feed</title>
    <style>
        :root {
            --win-blue: #2d89ef;
            --win-purple: #603cba;
            --win-orange: #da532c;
            --win-green: #00a300;
            --win-red: #b91d47;
            --win-teal: #00aba9;
            --win-pink: #ff0097;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI Semilight", "Segoe UI", Tahoma, sans-serif;
            background: url('background.png') no-repeat center center fixed;
            background-size: cover;
            color: white;
            overflow-x: hidden;
            background-color: #004d60; 
        }

        header {
            padding: 80px 60px 20px 60px;
            background: transparent; 
        }

        h1 { 
            font-weight: 300; 
            font-size: 56px; 
            margin: 0;
            letter-spacing: -1px;
            text-transform: lowercase;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .container {
            padding: 20px 60px 60px 60px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 260px);
            grid-auto-rows: 260px;
            gap: 10px;
        }

        .tile.wide {
            grid-column: span 2;
        }

        /* ЦВЕТ ЧАСОВ ИЗМЕНЕН НА ФИОЛЕТОВЫЙ */
        .clock-tile {
            background: var(--win-purple);
            justify-content: center;
            align-items: flex-start;
            padding-left: 35px !important;
        }

        #clock-time {
            font-size: 86px;
            font-weight: 100;
            margin: 0;
            line-height: 0.9;
        }

        #clock-date {
            font-size: 20px;
            margin: 10px 0 0 5px;
            text-transform: lowercase;
            opacity: 0.9;
        }

        .win8-button {
            display: inline-block;
            background: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 6px 12px;
            font-family: "Segoe UI", sans-serif;
            font-size: 13px;
            text-align: center;
            text-transform: lowercase;
            cursor: pointer;
            transition: all 0.1s ease;
            user-select: none;
            text-decoration: none;
            width: fit-content;
        }

        .win8-button:hover {
            background-color: #ffffff;
            color: #1d1d1d;
        }

        .win8-button:active {
            transform: scale(0.95);
        }

        .tile {
            perspective: 1000px;
            cursor: pointer;
        }

        .tile-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .tile.flip .tile-inner {
            transform: rotateY(180deg);
        }

        .tile-front, .tile-back {
            position: absolute;
            width: 100%;
            height: 100%;
            padding: 20px;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .tile-front h3 {
            font-size: 19px;
            font-weight: 300;
            margin: 0;
            line-height: 1.3;
        }

        .tile-back {
            transform: rotateY(180deg);
            background: #2b2b2b;
            border: 1px solid #444;
        }

        .tile-back p {
            font-size: 13px;
            line-height: 1.4;
            margin: 10px 0;
            flex-grow: 1;
            overflow: hidden;
        }

        .c1{background:var(--win-blue);}
        .c2{background:var(--win-teal);}
        .c3{background:var(--win-purple);}
        .c4{background:var(--win-orange);}
        .c5{background:var(--win-green);}
        .c6{background:var(--win-red);}
        .c7{background:var(--win-pink);}

        .modal {
            position: fixed;
            inset: 0;
            background: #1d1d1d;
            display: none;
            z-index: 1000;
            padding: 80px 60px;
            overflow-y: auto;
        }

        .modal-content {
            max-width: 900px;
            margin: 0 auto;
        }

        .modal-content h2 { font-size: 42px; font-weight: 300; margin-bottom: 30px; }

        .close-back-btn {
            position: fixed;
            top: 40px;
            left: 40px;
            width: 44px;
            height: 44px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
        }

        .close-back-btn::after {
            content: '';
            width: 12px;
            height: 12px;
            border-left: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            transform: rotate(45deg);
            margin-left: 4px;
        }

        .close-back-btn:hover {
            border-color: var(--win-blue);
            background-color: rgba(255,255,255, 0.1);
        }
    </style>
</head>
<body>

<header>
    <h1>новости</h1>
</header>

<div class="container">
    <div class="grid" id="grid"></div>
</div>

<div class="modal" id="modal">
    <div class="close-back-btn" onclick="closeModal()"></div>
    <div class="modal-content" id="modalContent"></div>
</div>

<script>
    const API = "https://api.rss2json.com/v1/api.json?rss_url=https://naked-science.ru/feed";
    const grid = document.getElementById("grid");
    const modal = document.getElementById("modal");
    const modalContent = document.getElementById("modalContent");
    const colors = ["c1","c2","c3","c4","c5","c6","c7"];

    function updateClock() {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        const dateStr = now.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
        
        const timeEl = document.getElementById('clock-time');
        const dateEl = document.getElementById('clock-date');
        
        if (timeEl) timeEl.textContent = timeStr;
        if (dateEl) dateEl.textContent = dateStr;
    }

    function createClockTile() {
        const clockTile = document.createElement("div");
        clockTile.className = "tile wide";
        clockTile.innerHTML = `
            <div class="tile-inner">
                <div class="tile-front clock-tile">
                    <p id="clock-time">00:00</p>
                    <p id="clock-date">загрузка...</p>
                </div>
            </div>
        `;
        grid.appendChild(clockTile);
        setInterval(updateClock, 1000);
        updateClock();
    }

    async function loadNews() {
        createClockTile();
        try {
            const res = await fetch(API);
            const data = await res.json();
            data.items.slice(0, 14).forEach((item, i) => createTile(item, i));
        } catch (e) { console.error(e); }
    }

    function createTile(article, i) {
        const tile = document.createElement("div");
        tile.className = "tile";

        tile.innerHTML = `
            <div class="tile-inner">
                <div class="tile-front ${colors[i % colors.length]}">
                    <h3>${article.title}</h3>
                    <div style="margin-top:auto;">
                        <div class="win8-button">читать далее</div>
                    </div>
                </div>
                <div class="tile-back">
                    <p>${article.description.replace(/<[^>]*>?/gm, '').substring(0, 160)}...</p>
                    <div class="win8-button" onclick="event.stopPropagation(); openArticle('${i}')">открыть</div>
                </div>
            </div>
        `;

        window[`article_${i}`] = article;
        tile.onclick = () => tile.classList.toggle("flip");
        grid.appendChild(tile);
    }

    function openArticle(id) {
        const article = window[`article_${id}`];
        modal.style.display = "block";
        document.body.style.overflow = "hidden";
        modalContent.innerHTML = `
            <h2>${article.title}</h2>
            <div style="font-size: 18px; line-height: 1.6; color: #ccc;">${article.content}</div>
            <br><br>
            <a href="${article.link}" target="_blank" class="win8-button">источник</a>
        `;
    }

    function closeModal() {
        modal.style.display = "none";
        document.body.style.overflow = "auto";
    }

    loadNews();
</script>
</body>
</html>
